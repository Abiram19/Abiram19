<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Abiram Pathmanathan Software Engineer Hero Banner</title>
  <desc id="hero-desc">A dark premium engineering-themed portfolio hero with blue grid lighting, technical curve artwork, availability badge, and current focus card.</desc>
  <defs>
    <pattern id="background-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4F8DFF" stroke-width=".4" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="top-edge" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity="0"/>
      <stop offset=".2" stop-color="#4F8DFF" stop-opacity=".08"/>
      <stop offset=".8" stop-color="#4F8DFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom-edge" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity="0"/>
      <stop offset=".2" stop-color="#4F8DFF" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#4F8DFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider-gradient" x1="0" y1="72.8" x2="0" y2="447.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity="0"/>
      <stop offset=".3" stop-color="#4F8DFF" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#4F8DFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="left-ambient-glow" cx="140" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity=".07"/>
      <stop offset=".7" stop-color="#4F8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="right-ambient-glow" cx="1230" cy="260" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity=".09"/>
      <stop offset=".65" stop-color="#4F8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="71%">
      <stop offset=".4" stop-color="#05070B" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070B" stop-opacity=".65"/>
    </radialGradient>
    <filter id="blue-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="faint-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="card-shadow" x="-25%" y="-45%" width="150%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="badge-shadow" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#4F8DFF" flood-opacity=".08"/>
    </filter>
    <filter id="green-dot-glow" x="-180%" y="-180%" width="460%" height="460%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="dotBlur"/>
      <feMerge>
        <feMergeNode in="dotBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="art-radial-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve-grad-1" x1="0" y1="0" x2="780" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity=".08"/>
      <stop offset=".4" stop-color="#4F8DFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="curve-grad-2" x1="780" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity=".04"/>
      <stop offset=".45" stop-color="#4F8DFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="focus-divider" x1="1268" y1="411" x2="1528" y2="411" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8DFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="right-panel-clip">
      <rect x="800" y="0" width="800" height="520"/>